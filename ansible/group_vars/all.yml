# Источник файлов для серверов: отдельный чистый клон APP_REPO на ветке main (не рабочая копия)
maxapoc_repo_url: git@github.com:OWNER/APP_REPO.git
maxapoc_repo_clone: /home/PROD_USER/.cache/infra-lab/APP_REPO
maxapoc_repo_version: main

#proxy
maxapoc_proxy_src: "{{ maxapoc_repo_clone }}/proxy"
proxy_env: {}

#monitoring_stack
maxapoc_network_name: maxapoc_net
maxapoc_monitoring_stack_src: "{{ maxapoc_repo_clone }}/observability"
