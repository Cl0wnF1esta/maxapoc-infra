[defaults]
# Путь к файлу инвентори (списку хостов)
inventory = ./inventory/hosts

# Путь к ролям
roles_path = ./roles

# Путь к коллекциям
collections_path = ./collections

# Отключаем проверку SSH-ключей хостов (удобно для lab/test, в production лучше True)
host_key_checking = True

# Количество одновременных задач (потоков)
forks = 10

# Отключаем создание файлов с расширением .retry
retry_files_enabled = False

[privilege_escalation]
# Запрашивать пароль sudo (False, если настроен беспарольный sudo)
become_ask_pass = True
