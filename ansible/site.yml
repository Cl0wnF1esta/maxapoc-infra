---
- name: Bring VM to base state
  hosts: infra
  become: true
  environment: "{{ proxy_env }}"
  roles:
    - common
    - security
    - docker
    - maxapoc_proxy
    - role: maxapoc_deploy_access
      when: maxapoc_deploy_access_enabled | bool
    - role: maxapoc_monitoring
      when: maxapoc_monitoring_enabled | bool
