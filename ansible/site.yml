---
- name: Bring VM to base state
  hosts: maxapoc_servers
  become: true
  environment: "{{ proxy_env }}"
  pre_tasks:
    - name: Clean clone of APP_REPO at main (source of files for servers)
      ansible.builtin.git:
        repo: "{{ maxapoc_repo_url }}"
        dest: "{{ maxapoc_repo_clone }}"
        version: "{{ maxapoc_repo_version }}"
        force: false
      delegate_to: localhost
      run_once: true
      become: false
  roles:
    - common
    - security
    - docker
    - role: backup
      when: backup_enabled | bool
    - maxapoc_proxy
    - role: maxapoc_deploy_access
      when: maxapoc_deploy_access_enabled | bool
    - role: maxapoc_monitoring
      when: maxapoc_monitoring_enabled | bool

