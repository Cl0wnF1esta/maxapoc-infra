---
# 1. Создать рабочее пространство для разворачивания прокси на сервере
- name: Create workspace for proxy
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
    state: directory
  loop: 
    - { path: '{{ maxapoc_proxy_dest }}', mode: '0755' }
    - { path: '{{ maxapoc_proxy_dest }}/vps', mode: '0755' }
    - { path: '{{ maxapoc_proxy_dest }}/vps/certs', owner: '{{ maxapoc_proxy_uid }}', group: '{{ maxapoc_proxy_gid }}', mode: '0700' }
    
# 2. Создать сеть для maxapoc
- name: Create shared Docker network for MaxApoc
  community.docker.docker_network:
    name: "{{ maxapoc_network_name }}"
    state: present

# 3a. Доставить на сервер proxy compose file
- name: Deliver proxy compose file
  ansible.builtin.copy:
    src: "{{ maxapoc_proxy_src }}/vps/docker-compose.yml"
    dest: "{{ maxapoc_proxy_dest }}/vps/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

# 3b. Доставить исходники — только для сборки на сервере
- name: Deliver source code for build on server
  ansible.builtin.include_tasks: build_on_server.yml
  when: maxapoc_proxy_build_on_server | bool

# 3c. Вход в реестр — только когда образ скачивается
- name: Log in to image registry
  community.docker.docker_login:
    registry_url: "{{ maxapoc_proxy_registry }}"
    username: "{{ maxapoc_proxy_registry_user }}"
    password: "{{ maxapoc_proxy_registry_token }}"
  no_log: true
  when: not (maxapoc_proxy_build_on_server | bool)
      
# 4. Создать .env с контентом
- name: make .env from secrets
  ansible.builtin.template:
    src: env.j2
    dest: "{{ maxapoc_proxy_dest }}/vps/.env"
    owner: root
    group: root
    mode: '0600' # только для root
  no_log: true

# 5. Залить серверные сертификаты и ключ
- name: cp server certs and key
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"    
    mode: "{{ item.mode }}"
  loop:
    - { dest: '{{ maxapoc_proxy_dest }}/vps/certs/ca.crt', content: '{{ maxapoc_proxy_ca_crt }}', mode: '0644', owner: '{{ maxapoc_proxy_uid }}', group: '{{ maxapoc_proxy_gid }}'  }
    - { dest: '{{ maxapoc_proxy_dest }}/vps/certs/server.crt', content: '{{ maxapoc_proxy_server_crt }}', mode: '0644', owner: '{{ maxapoc_proxy_uid }}', group: '{{ maxapoc_proxy_gid }}' }
    - { dest: '{{ maxapoc_proxy_dest }}/vps/certs/server.key', content: '{{ maxapoc_proxy_server_key }}', mode: '0600', owner: '{{ maxapoc_proxy_uid }}', group: '{{ maxapoc_proxy_gid }}' }
  no_log: true
  notify: Restart proxy if certs or gateways changed
    
# 6. Создать gateways.json
- name: make gateways.json
  ansible.builtin.copy:
    src: "{{ maxapoc_proxy_src }}/vps/gateways.example.json"
    dest: "{{ maxapoc_proxy_dest }}/vps/gateways.json"
    owner: root
    group: "{{ maxapoc_proxy_gid }}"
    mode: '0640' # RW - root / R - группа владельца
  notify: Restart proxy if certs or gateways changed   # файл подключён в контейнер отдельным файлом - после замены нужен перезапуск

# 7. Сборка и запуск dockerfile
- name: Build and run Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ maxapoc_proxy_dest }}/vps"  # Путь к каталогу с docker-compose.yml
    state: present  # Аналог "up -d"
    build: "{{ ('always' if code_delivery.changed else 'policy') if maxapoc_proxy_build_on_server | bool else 'never' }}"
    pull: "{{ 'policy' if maxapoc_proxy_build_on_server | bool else 'missing' }}"
    wait: true  # Ждет статуса healthy
  register: result_build_dockerfile_and_run_compose
  until: result_build_dockerfile_and_run_compose is succeeded
  retries: 2
  delay: 3
