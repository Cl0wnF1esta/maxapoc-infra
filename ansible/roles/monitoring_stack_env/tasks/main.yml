---
# 1. Создать директорию
- name: mkdir
  ansible.builtin.file:
    path: "{{ monitoring_stack_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700' # только для root
    
# 2. Создать .env из зашифрованных переменных
- name: make .env from secrets
  ansible.builtin.copy:
    content: |
      GRAFANA_ADMIN_PASSWORD="{{ grafana_admin_password }}"
      TELEGRAM_TOKEN="{{ telegram_token }}"
    dest: "{{ monitoring_stack_env_dir }}/.env"
    owner: root
    group: root
    mode: '0600' # только для root
  no_log: true
