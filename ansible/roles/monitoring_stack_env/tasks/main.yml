---
- name: Создать директорию
  ansible.builtin.file:
    path: "{{ monitoring_stack_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700' # только для root
    
- name: Создать файл .env из зашифрованных переменных
  ansible.builtin.copy:
    content: |
      GRAFANA_ADMIN_PASSWORD="{{ grafana_admin_password }}"
      TELEGRAM_TOKEN="{{ telegram_token }}"
    dest: "{{ monitoring_stack_env_dir }}/.env"
    owner: root
    group: root
    mode: '0600' # только для root
  no_log: true
