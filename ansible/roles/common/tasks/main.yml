---
# 1. Проверка ОС
- name: Check OS distribution and version
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '24.04'
    fail_msg: "ERROR: This role supports only Ubuntu 24.04. Current OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
    success_msg: "OS validation passed: Ubuntu 24.04 detected."

# 2. Обновление apt и установка пакетов
- name: Update apt cache and install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: yes

# 3. Настройка часового пояса
- name: Set system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

# 4. SWAP
# Шаг 1. Создать файл
- name: Create swap file
  ansible.builtin.command:
    cmd: "dd if=/dev/zero of={{ common_swap_file_path }} bs=1M count={{ common_swap_size_mb }}"
    creates: "{{ common_swap_file_path }}"
  register: swap_file_created

# Шаг 2. Права 0600
- name: Set permissions on swap file
  ansible.builtin.file:
    path: "{{ common_swap_file_path }}"
    owner: root
    group: root
    mode: "0600"

# Шаг 3. Разметить как swap
- name: Format swap file
  ansible.builtin.command:
    cmd: "mkswap {{ common_swap_file_path }}"
  when: swap_file_created.changed

# Шаг 4а. Посмотреть, какой swap активен
- name: Check active swap
  ansible.builtin.command:
    cmd: "swapon --show"
  register: swap_active
  changed_when: false
  check_mode: false

# Шаг 4б. Включить, если не активен
- name: Enable swap
  ansible.builtin.command:
    cmd: "swapon {{ common_swap_file_path }}"
  when: common_swap_file_path not in swap_active.stdout

# Шаг 5. Запись в fstab, чтобы swap пережил перезагрузку
- name: Add swap to fstab
  ansible.posix.mount:
    src: "{{ common_swap_file_path }}"
    path: none
    fstype: swap
    opts: sw
    state: present
