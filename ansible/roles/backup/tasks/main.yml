---
# 1. Установить restic и sqlite3
- name: Install restic and sqlite3
  ansible.builtin.apt:
    name: [restic, sqlite3]
    state: present

# 2. Создать окружение
- name: Config directory
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: '0700'

# 3. Разместить конфиг репозитория и ключи s3
- name: Repository settings and S3 keys
  ansible.builtin.template:
    src: env.j2
    dest: /etc/restic/env
    owner: root
    group: root
    mode: '0600'
  no_log: true

# 4. Разместить restic pass
- name: Repository password
  ansible.builtin.copy:
    content: "{{ backup_restic_password }}\n"
    dest: /etc/restic/password
    owner: root
    group: root
    mode: '0400'                       # только чтение и только root
  no_log: true

# 5. Разместить скрипты restic
- name: Scripts restic-env and backup-run
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: '0700'
  loop: [restic-env, backup-run, backup-alert]

# 6. Проверить, что репозиторий создаётся один раз(если он уже есть, restic init не выполняется)
- name: Check repository exists
  ansible.builtin.command: /usr/local/sbin/restic-env cat config
  register: backup_repo_check
  changed_when: false
  failed_when: false

# 7. Инит репозитория restic
- name: Initialize repository
  ansible.builtin.command: /usr/local/sbin/restic-env init
  when: backup_repo_check.rc != 0
  
# 8. Разместить конфиг restic для алертов
- name: Telegram settings for failure alert
  ansible.builtin.template:
    src: alert.env.j2
    dest: /etc/restic/alert.env
    owner: root
    group: root
    mode: '0600'
  no_log: true

# 10. Разместить новые юниты systemd
- name: systemd units (service, alert, timer)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [backup.service, backup-alert.service, backup.timer]
  notify: Reload systemd

# 10a. Запустить хэндлер для релоада systemd(должен перечитать новые юниты до включения таймера)
- name: Apply pending systemd reload
  ansible.builtin.meta: flush_handlers

# 11. Включить таймер бэкапов в systemd
- name: Enable daily backup timer
  ansible.builtin.systemd_service:
    name: backup.timer
    enabled: true
    state: started
