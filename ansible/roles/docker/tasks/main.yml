---
# 1. Предустановка пакетов для создания ключа и доступа к репозиторию Docker
- name: Pre-install packages for docker repo key
  ansible.builtin.apt:
    name: "{{ docker_prereq_packages }}"
    state: present
    update_cache: yes
  register: result_pre_install_packages
  until: result_pre_install_packages is succeeded
  retries: 5
  delay: 3
  
# 2. Создание директории для хранения ключа репозитория Docker
- name: Create directory for repo-key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    mode: "0755"
    state: directory
    
# 3. Скачивание и размещение ключа для доступа к репозиторию Docker
- name: Download repo-key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    timeout: 20
  register: result_download_repo_key
  until: result_download_repo_key is succeeded
  retries: 5
  delay: 3
    
# 4. Добавление репозитория Docker к списку пакетов Apt
- name: Add the repository to Apt sources
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    
# 5. Обновление кэша Apt
- name: Apt update cache
  ansible.builtin.apt:
    update_cache: yes
  changed_when: false
  register: result_apt_cache_update
  until: result_apt_cache_update is succeeded
  retries: 5
  delay: 3
    
# 6. Установка пакетов Docker
- name: Install packages Docker from repo
  ansible.builtin.apt:
    name: "{{ docker_packages | map(attribute='name') | zip(docker_packages | map(attribute='version')) | map('join', '=') | list }}"
    state: present
    allow_change_held_packages: false
  register: result_install_docker_packages
  until: result_install_docker_packages is succeeded
  retries: 5
  delay: 3

# 7. Зафиксировать версии пакетов от обновлений
- name: Hold packages versions for upgrade
  ansible.builtin.dpkg_selections:
    name: "{{ item.name }}"
    selection: hold
  loop: "{{ docker_packages }}"
  
# 8. Настройка proxy для демона Docker
- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker
  
# 9. Проверка статуса и включение Docker
- name: Check docker status and autorun
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# 10. Выполнение handlers сразу, а не в конце  
- name: Apply Docker config now
  ansible.builtin.meta: flush_handlers
