# basic
ansible_host: "{{ vault_ansible_host }}"

# auth
ansible_user: "{{ vault_ansible_user }}"
ansible_port: 22
ansible_ssh_private_key_file: "{{ vault_ansible_ssh_private_key_file }}"

# swap & ufw
common_swap_size_mb: 1024
security_ufw_allowed_ports:
  - name: Maxapoc-proxy
    proto: tcp
    port: 8443
  - name: XRay(VPN)-inbounds
    proto: tcp
    port: "33000:38000"
  - name: XRay(VPN)-Subscriptions
    proto: tcp
    port: 2096
  - name: XRay(VPN)-AdminPanel
    proto: tcp
    port: 4467
  - name: WireGuard-tunnel
    proto: udp
    port: 51820
  - name: Zabbix-hoster-1
    proto: tcp
    port: 10050
    src: "{{ vault_hoster_zabbix_addrs[0] }}"
  - name: Zabbix-hoster-2
    proto: tcp
    port: 10050
    src: "{{ vault_hoster_zabbix_addrs[1] }}"
  - name: Zabbix-hoster-3
    proto: tcp
    port: 10050
    src: "{{ vault_hoster_zabbix_addrs[2] }}"

# maxapoc_proxy
  # basic
maxapoc_proxy_metrics_bind: 10.66.66.1   # Prometheus hobot-metrics забирает метрики по WireGuard
  # Deploy rules
maxapoc_proxy_image: ghcr.io/cl0wnf1esta/maxapoc-proxy@sha256:f16b4f2a0fd2483f375e70c2cba7dd0b326b84ce339a941a35a4bfa01e68c43a
maxapoc_proxy_registry_token: "{{ vault_maxapoc_proxy_registry_token }}"
  # Certificates
maxapoc_proxy_server_crt: "{{ vault_maxapoc_proxy_server_crt }}"
maxapoc_proxy_server_key: "{{ vault_maxapoc_proxy_server_key }}"
maxapoc_proxy_ca_crt: "{{ vault_maxapoc_proxy_ca_crt }}"
  # App Keys
maxapoc_proxy_app_key: "{{ vault_maxapoc_proxy_app_key }}"
  # GitHub Repos
maxapoc_proxy_gh_app_token: "{{ vault_maxapoc_proxy_gh_app_token }}"
maxapoc_proxy_gh_hub_token: "{{ vault_maxapoc_proxy_gh_hub_token }}"
  # LLM-gateway keys
maxapoc_proxy_llm_odirouter_key: "{{ vault_maxapoc_proxy_llm_odirouter_key }}"
maxapoc_proxy_llm_routeway_key: "{{ vault_maxapoc_proxy_llm_routeway_key }}"

# Deploy access (CI)
maxapoc_deploy_access_enabled: true
maxapoc_deploy_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH5ENPFTPmUXKHuRFC0KP7JfVz0OVH3TewvP7BNrOoxl maxapoc-deploy@prod-ci"

# maxapoc_monitoring_stack
maxapoc_monitoring_enabled: false # на проде пока не ставим (решение Д1: не хватает памяти)
  # Alertamanger
maxapoc_monitoring_telegram_token: "{{ vault_maxapoc_monitoring_telegram_token }}"
maxapoc_monitoring_telegram_chat_id: "{{ vault_maxapoc_monitoring_telegram_chat_id }}"
  # Grafana
maxapoc_monitoring_grafana_admin_password: "{{ vault_maxapoc_monitoring_grafana_admin_password }}"

# backup
  # basic
backup_enabled: true
backup_paths:
  - /etc/wireguard
  - /root/cert
  - /root/.acme.sh
  - /root/hobot-metrics
  - /opt/maxapoc/proxy/vps/release.env
  - /var/lib/docker/volumes/hobot-metrics_alertmanager-data/_data
  - /var/lib/docker/volumes/hobot-metrics_prometheus-data/_data
  # restic
backup_repo_name: prod
backup_restic_password: "{{ vault_backup_restic_password }}"
  # hosters-s3
backup_s3_access_key: "{{ vault_backup_s3_access_key }}"
backup_s3_secret_key: "{{ vault_backup_s3_secret_key }}"
  # SQLite
backup_sqlite_dbs:
  - { src: /etc/x-ui/x-ui.db, name: x-ui.db }
  - { src: /var/lib/docker/volumes/hobot-metrics_grafana-data/_data/grafana.db, name: hobot-grafana.db }
  # alerting
backup_alert_telegram_token: "{{ maxapoc_monitoring_telegram_token }}"
backup_alert_telegram_chat_id: "{{ maxapoc_monitoring_telegram_chat_id }}"

# Application repositories
maxapoc_repo_url: "{{ vault_maxapoc_repo_url }}"
maxapoc_proxy_gh_app_repo: "{{ vault_maxapoc_proxy_gh_app_repo }}"
maxapoc_proxy_gh_hub_repo: "{{ vault_maxapoc_proxy_gh_hub_repo }}"
